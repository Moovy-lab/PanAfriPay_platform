name: panafripay

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  TZ: ${TZ:-UTC}
  PYTHONPATH: /opt/airflow/src
  DATA_DIR: /data
  WAREHOUSE_DIR: /warehouse
  SPARK_MASTER_URL: spark://spark-master:7077
  WAREHOUSE_DB_HOST: postgres
  WAREHOUSE_DB_PORT: "5432"
  WAREHOUSE_DB_NAME: ${WAREHOUSE_DB}
  WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
  WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
  PII_HASH_SALT: ${PII_HASH_SALT}
  DBT_PROFILES_DIR: /opt/airflow/dbt
  DBT_BIN: /home/airflow/dbt_venv/bin/dbt

x-airflow-common: &airflow-common
  build:
    context: ./infra/airflow
  image: panafripay/airflow:2.9.3
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped
  environment: *airflow-env
  volumes:
    - ./dags:/opt/airflow/dags:z
    - ./logs:/opt/airflow/logs:z
    - ./src:/opt/airflow/src:z
    - ./dbt:/opt/airflow/dbt:z
    - ./tests:/opt/airflow/tests:z
    - ./data:/data:z
    - ./warehouse:/warehouse:z
  networks: [panafripay_net]

x-spark-common: &spark-common
  build:
    context: ./infra/spark
    args:
      SPARK_UID: ${AIRFLOW_UID:-50000}
  image: panafripay/spark:3.5.3
  restart: unless-stopped
  volumes:
    - ./data:/data:z
    - ./warehouse:/warehouse:z
  networks: [panafripay_net]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [panafripay_net]


  airflow-init:
    <<: *airflow-common
    restart: "no"
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Admin --role Admin --email admin@example.com || true
        airflow connections add warehouse_pg \
          --conn-uri "postgresql://${WAREHOUSE_DB_USER}:${WAREHOUSE_DB_PASSWORD}@postgres:5432/${WAREHOUSE_DB}" || true
        airflow connections add spark_default \
          --conn-type spark --conn-host spark://spark-master --conn-port 7077 || true
    depends_on:
      postgres: { condition: service_healthy }

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    environment:
      <<: *airflow-env
      AIRFLOW__WEBSERVER__WORKERS: "1"
    ports: [ "${AIRFLOW_WEB_PORT:-8080}:8080" ]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: >
      /usr/local/lib/python3.11/site-packages/pyspark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports: ["${SPARK_MASTER_UI_PORT:-8081}:8080"]

  spark-worker:
    <<: *spark-common
    hostname: spark-worker
    command: >
      /usr/local/lib/python3.11/site-packages/pyspark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1500m}
    ports: ["${SPARK_WORKER_UI_PORT:-8082}:8081"]
    depends_on: [spark-master]

  # Optionnel : démarre seulement avec  docker compose --profile minio up -d
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [panafripay_net]

networks:
  panafripay_net:
    driver: bridge

volumes:
  pg_data:
  minio_data:
