[project]
name = "PanAfriPay"
version = "0.1.0"
description = "Pipeline Lakehouse de traitement de données Mobile Money"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyspark>=3.5",
    "delta-spark>=3.0",
    "pydantic>=2.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.report]
fail_under = 60

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
